services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: boleteria
      POSTGRES_PASSWORD: boleteria
      POSTGRES_DB: boleteria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boleteria -d boleteria"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://boleteria:boleteria@db:5432/boleteria
      APP_URL: http://localhost:3000
      # Solo para desarrollo local. En producción se reemplazan.
      APP_SECRET: local-dev-app-secret-change-before-any-deploy
      QR_SECRET: local-dev-qr-secret-change-before-any-deploy
      ADMIN_EMAIL: admin@boleteria.local
      ADMIN_INITIAL_PASSWORD: Cambiame1234
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  pgdata:
  app_node_modules:
  uploads:
